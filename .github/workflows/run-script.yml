name: Run Script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script to execute"
        required: true
        type: choice
        options:
          - db/archive-full.sh
          - db/archive-dev.sh
          - db/archive-public.sh
          - db/disaster-recovery.sh
          - processor/otr-processor-job.sh
          - public-dump-web/generate-index.sh
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: "staging"
        options:
          - staging
          - production

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      can_proceed: ${{ steps.check.outputs.can_proceed }}
      error_message: ${{ steps.check.outputs.error_message }}
    steps:
      - name: Validate script and environment
        id: check
        run: |
          SCRIPT="${{ github.event.inputs.script }}"
          ENV="${{ github.event.inputs.environment }}"

          PROD_ONLY="db/archive-full.sh db/archive-dev.sh db/archive-public.sh"

          if [[ "$PROD_ONLY" == *"$SCRIPT"* ]] && [[ "$ENV" != "production" ]]; then
            echo "can_proceed=false" >> $GITHUB_OUTPUT
            echo "error_message=${SCRIPT} can only run in production" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "can_proceed=true" >> $GITHUB_OUTPUT

  execute:
    needs: validate
    if: needs.validate.outputs.can_proceed == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Execute script via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "$HOME/otr-scripts"
            git pull
            cd src
            echo "Executing: ${{ github.event.inputs.script }}"
            echo "Environment: ${{ github.event.inputs.environment }}"
            echo "Triggered by: ${{ github.actor }}"
            ENV="${{ github.event.inputs.environment }}" bash "${{ github.event.inputs.script }}"

  report-blocked:
    needs: validate
    if: needs.validate.outputs.can_proceed == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Report validation failure
        run: |
          echo "::error::${{ needs.validate.outputs.error_message }}"
          exit 1
